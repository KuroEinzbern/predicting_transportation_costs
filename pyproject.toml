[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting_transportation_costs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "pyarrow>=18,<26",
    "scikit-learn>=1.7,<1.9",
    "xgboost>=2.1.1,<3",
    "optuna>=3.6,<5",
    "lightgbm>=4.5,<5",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "statsmodels>=0.15,<0.16",
    "prefect>=3.0.0,<4.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "joblib>=1.3.0,<2.0.0",
    "pytest>=8.0,<9.0",
    "httpx2>=2.0,<3.0",
    "huggingface_hub>=0.30,<1.0"
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["predicting_transportation_costs*"]

[tool.setuptools.package-data]
"predicting_transportation_costs" = ["config/*.yaml"]

